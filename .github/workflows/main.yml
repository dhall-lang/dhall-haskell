env:
  cache_generation: 2024-06-13

# NOTE: Please keep .mergify.yml in sync when adding or removing any jobs.
name: main
# Caches written by pull_request are stored on the merge ref and are invisible
# to other PRs. push to main writes the default-branch copies that later PRs
# restore. Which jobs are cached, and how the key is built, is on the Cache step.
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    strategy:
      matrix:
        os:
          - runner: 'macOS-latest'
            archive-command: 'tar --create --bzip2 --file'
            file-extension: 'tar.bz2'
            executable-extension: ''
          - runner: 'ubuntu-latest'
            archive-command: 'tar --create --bzip2 --file'
            file-extension: 'tar.bz2'
            executable-extension: ''
          - runner: 'windows-latest'
            archive-command: '7z a -tzip'
            file-extension: 'zip'
            executable-extension: '.exe'
        stack-yaml:
          - "stack.yaml"
        include:
          - os:
              runner: "ubuntu-latest"
            stack-yaml: "stack.ghc-8.10.yaml"
          - os:
              runner: "ubuntu-latest"
            stack-yaml: "stack.ghc-9.2.yaml"
          - os:
              runner: "ubuntu-latest"
            stack-yaml: "stack.ghc-9.4.yaml"
          - os:
              runner: "ubuntu-latest"
            stack-yaml: "stack.ghc-9.8.yaml"
          - os:
              runner: "ubuntu-latest"
            stack-yaml: "stack.ghc-9.10.yaml"
          - os:
              runner: "ubuntu-latest"
            stack-yaml: "stack.ghc-9.12.yaml"
      fail-fast: false
    name: ${{ matrix.os.runner }} - ${{ matrix.stack-yaml }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          submodules: true
      - id: setup-haskell-cabal
        name: "Setup Haskell environment"
        uses: haskell-actions/setup@v2.12
        with:
          enable-stack: true
          stack-version: "latest"
          stack-no-global: true
      # Cache the required builds only: Ubuntu stack.yaml (GHC 9.6), macOS, and Windows.
      # The other resolvers (stack.ghc-8.10.yaml, 9.2, 9.4, 9.8, 9.10, 9.12) skip
      # this step. Skipping actions/cache skips both the restore and the post-job
      # save. Each of those snapshots is about 1.5 GB, and the repository cache
      # quota is 10 GB, so saving them was evicting the required entries.
      #
      # Key: runner, arch, cache_generation, and a hash of that job's Stack file.
      # There is no restore-keys prefix. The old prefix matched every Ubuntu
      # snapshot, so a miss downloaded another GHC and the post step saved that
      # tree under this job's key. An exact hit still restores the right snapshot.
      # The path is the Stack root only (the compiler and the snapshot packages).
      # .stack-work stays in the checkout, so local packages rebuild on every run.
      # bench.yml uses this same Ubuntu key. dhall-try has its own Nix cache below.
      - name: "Cache"
        if: matrix.stack-yaml == 'stack.yaml'
        uses: actions/cache@v6
        with:
          key: ${{ matrix.os.runner }}-${{ runner.arch }}-${{ env.cache_generation }}-${{ hashFiles(matrix.stack-yaml) }}
          path: |
            ${{ steps.setup-haskell-cabal.outputs.stack-root }}
      # Workaround for Ubuntu 26.04 that no longer has ld.gold but Stack's GHC bindist thinks it's still there (cached from Ubuntu 24.04)
      - name: "Install gold linker"
        if: runner.os == 'Linux'
        run: sudo apt-get install -y binutils-gold
      - name: "Install libsodium"
        shell: bash
        run: |
          if [ '${{matrix.os.runner}}' == 'ubuntu-latest' ]; then
            sudo apt-get install -y libsodium-dev
          fi
          echo "::debug::'pkg-config libsodium' output:"
          pkg-config --print-errors --libs libsodium || true
      # Workaround for macos-26 issue with command line tools, see https://github.com/actions/runner-images/issues/14940 and https://github.com/actions/runner-images/pull/15002
      - name: "Use Command Line Tools linker"
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - name: "Build"
        shell: bash
        run: |
          packages=(
            dhall
            dhall-bash
            dhall-csv
            dhall-docs
            dhall-json
            dhall-lsp-server
            dhall-nix
            dhall-openapi
            dhall-toml
            dhall-yaml
          )
          for package in "${packages[@]}"; do
            if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.8.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi
            if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.10.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi
            if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.12.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi
            if [ '${{matrix.os.runner}}' == 'windows-latest' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi

            # We use --test --no-run-tests to avoid re-building all the local packages in the
            # subsequent test step.
            # See https://github.com/commercialhaskell/stack/issues/4977.
            stack --stack-yaml "${{matrix.stack-yaml}}" build --test --no-run-tests --copy-bins --local-bin-path ./bin "${package}"
          done
      - name: "Run tests"
        shell: bash
        run: |
          packages=(
            dhall
            dhall-bash
            dhall-csv
            dhall-docs
            dhall-json
            dhall-lsp-server
            dhall-nix
            dhall-openapi
            dhall-toml
            dhall-yaml
          )
          for package in "${packages[@]}"; do
            if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.8.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi
            if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.10.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi
            if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.12.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi
            if [ '${{matrix.os.runner}}' == 'windows-latest' ] && [ "${package}" == 'dhall-nix' ]; then
              continue
            fi

            stack --stack-yaml "${{matrix.stack-yaml}}" test "${package}"
          done
      - name: "Prepare packaging"
        if: ${{ matrix.stack-yaml == 'stack.yaml' }}
        shell: bash
        run: |
          mkdir -p share/man/man1
          cp dhall/man/dhall.1 share/man/man1/
          cp dhall-docs/src/Dhall/data/man/dhall-docs.1 share/man/man1/
      - id: package
        name: "Create packages"
        if: ${{ matrix.stack-yaml == 'stack.yaml' }}
        shell: bash
        run: |
          packages=(
            dhall
            dhall-bash
            dhall-csv
            dhall-docs
            dhall-json
            dhall-lsp-server
            dhall-nix
            dhall-openapi
            dhall-toml
            dhall-yaml
          )

          function package() (
            local package="${1}"
            local version="$(stack query locals "${package}" version)"
            shift
            local assets=("${@}")
            local package_file="${package}-${version}-${{ runner.os }}-${{ runner.arch }}.${{ matrix.os.file-extension }}"
            ${{matrix.os.archive-command}} "${package_file}" "${assets[@]}"
          )

          exe='${{matrix.os.executable-extension}}'
          package 'dhall' "bin/dhall${exe}" 'share/man/man1/dhall.1'
          package 'dhall-bash' "bin/dhall-to-bash${exe}"
          package 'dhall-csv' "bin/csv-to-dhall${exe}" "bin/dhall-to-csv${exe}"
          package 'dhall-docs' "bin/dhall-docs${exe}" 'share/man/man1/dhall-docs.1'
          package 'dhall-json' "bin/dhall-to-json${exe}" "bin/dhall-to-yaml${exe}" "bin/json-to-dhall${exe}"
          package 'dhall-lsp-server' "bin/dhall-lsp-server${exe}"
          if [ '${{matrix.os.runner}}' != 'windows-latest' ]; then
              package 'dhall-nix' "bin/dhall-to-nix${exe}"
          fi
          package 'dhall-openapi' "bin/openapi-to-dhall${exe}"
          package 'dhall-toml' "bin/dhall-to-toml${exe}" "bin/toml-to-dhall${exe}"
          package 'dhall-yaml' "bin/dhall-to-yaml-ng${exe}" "bin/yaml-to-dhall${exe}"
      - name: "Upload package"
        if: ${{ matrix.stack-yaml == 'stack.yaml' }}
        uses: actions/upload-artifact@v7
        with:
          name: 'dhall-${{ runner.os }}-${{ runner.arch }}.${{ matrix.os.file-extension }}'
          path: 'dhall-*${{ runner.os }}-${{ runner.arch }}.${{ matrix.os.file-extension }}'

  # GHC's JavaScript backend, which is not a Stack target. Kept out of the matrix and
  # out of .mergify.yml so a JS compile failure does not block native packages.
  # See nix/javascript.nix and release.nix (javascript-dhall-try).
  dhall-try:
    name: ubuntu-latest - dhall-try
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: "Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.dhall-lang.org https://dhall.cachix.org
            extra-trusted-public-keys = cache.dhall-lang.org:I9/H18WHd60olG5GsIjolp7CtepSgJmM2CsO813VTmM= dhall.cachix.org-1:8laGciue2JBwD49ICFtg+cIF8ddDaW7OFBjDb/dHEAo=
      # dhall-try is a Nix build, so it does not use the Stack cache above.
      # It stays cached because the JavaScript build is part of the required set.
      # primary-key changes when nix/pinnedNixpkgs.nix or nix/javascript.nix changes.
      # An older store can be restored from the nix-js-<os>- prefix. purge-primary-key
      # is never, so that restore does not delete the current entry.
      - name: "Cache Nix store"
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-js-${{ runner.os }}-${{ hashFiles('nix/pinnedNixpkgs.nix', 'nix/javascript.nix') }}
          restore-prefixes-first-match: nix-js-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-js-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never
      - name: "Build dhall-try"
        run: |
          nix-build nix/javascript.nix -A dhall-try -o "$GITHUB_WORKSPACE/result"
          # Leave this symlink in place. It is a GC root for the cross compiler,
          # which ./result does not keep. The cache key is not updated after
          # the first save.
          nix-build nix/javascript.nix -A cache-roots -o "$GITHUB_WORKSPACE/dhall-try-cache-roots"
          # result/ is a symlink into /nix/store, which upload-artifact will not follow.
          cp -L "$GITHUB_WORKSPACE/result/bin/dhall-try.jsexe/all.min.js" "$GITHUB_WORKSPACE/dhall-try.all.min.js"
      - name: "Upload minified interpreter"
        uses: actions/upload-artifact@v7
        with:
          name: dhall-try-all.min.js
          path: dhall-try.all.min.js
          retention-days: 14
          if-no-files-found: error
